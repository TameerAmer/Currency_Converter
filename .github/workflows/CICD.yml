name: Simple run tests
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Build and push Docker image
      id: set-image-tag
      run: |
        echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        TAG="${{ github.sha }}-$(date +%Y%m%d-%H%M%S)"
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/currency_converter:$TAG .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/currency_converter:$TAG


    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Run Black formatting check
      run: |
        black --check --diff .

    - name: Run Flake8 linting
      run: |
        flake8 . --exclude=.venv
        # FAILS if there are any linting violations (uses .flake8 config)

    - name: Install app dependencies (after linting passes)
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        docker run  -p 8080:8080 --rm ${{ secrets.DOCKERHUB_USERNAME }}/currency_converter:$TAG
        pytest tests/











